name: CI

# Tests only. Releases are built against a specific ODP build (its distro Maven coordinates) and
# published to Nexus by the Jenkins job `odp-hwc` (see Jenkinsfile). Do not add a publish job here:
# one that runs on push re-publishes the release artifact on every commit.
on:
  push:
    branches: ["master","main"]
    tags: ["*"]
  pull_request:
    branches: ["master","main"]
  workflow_dispatch:

jobs:
  build-spark-llap-hwc:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - name: Build and test
        run: sbt test "It / test"
